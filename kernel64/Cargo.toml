[package]
name = "kernel64"
version = "0.1.0"
edition = "2021"

# x86-64 kernel.  The only dependency is the shared ABI crate: syscall ids,
# Status codes, handle encoding and struct layouts live there so the kernel and
# user space cannot drift apart (design §4.1).

[profile.dev]
panic = "abort"
opt-level = 1
lto = false
debug = false

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
debug = false

[dependencies]
rondos-abi = { path = "../user/lib/rondos-abi", default-features = false, features = ["kernel"] }
