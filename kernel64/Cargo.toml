[package]
name = "kernel64"
version = "0.1.0"
edition = "2021"

# M0 scaffold: the x86-64 kernel that replaces kernel/ (i686) at M0.8.
# No dependencies on purpose — boot is a multiboot trampoline until the UEFI
# stub (M0.7) lands.

[profile.dev]
panic = "abort"
opt-level = 1
lto = false
debug = false

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
debug = false

[dependencies]
