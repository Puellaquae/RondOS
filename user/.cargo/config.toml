[build]
target = "targets/x86_64-rondos.json"
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-arg=--script=user.ld",
    "-C", "link-arg=--no-pie",
    "-C", "link-arg=-znorelro",
    "-C", "strip=debuginfo",
]

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true
